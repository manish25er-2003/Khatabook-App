<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16A085" />
    <title>KhataPro Offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f4fdf9 0%, #edf9f4 100%);
        font-family: Arial, Helvetica, sans-serif;
        color: #123a31;
      }
      .card {
        width: min(90vw, 360px);
        background: rgba(255,255,255,0.8);
        border: 1px solid rgba(13,141,93,0.14);
        border-radius: 24px;
        box-shadow: 0 18px 34px rgba(15, 93, 77, 0.08);
        padding: 28px 20px 22px;
        text-align: center;
      }
      .badge {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        margin: 0 auto 16px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #18a66d 0%, #0d8d5d 100%);
        color: white;
        font-size: 1.8rem;
        font-weight: 800;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.9rem;
        letter-spacing: -0.06em;
      }
      p {
        margin: 0;
        line-height: 1.5;
        color: #496863;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">K</div>
      <h1>KhataPro</h1>
      <p>You are offline right now. Please reconnect to the internet to sync your business data.</p>
    </div>
  </body>
</html>
